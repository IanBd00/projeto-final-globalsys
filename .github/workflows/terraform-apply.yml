
name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Run ID da execução bem-sucedida de Terraform Plan na main"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.14.x"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    name: Apply Reviewed Plan
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest

    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_private_key_path: /tmp/oci_api_key.pem
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_compartment_id: ${{ vars.OCI_COMPARTMENT_ID }}
      TF_VAR_image_id: ${{ vars.OCI_IMAGE_ID }}
      TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS }}

      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      STATE_NAMESPACE: ${{ vars.OCI_NAMESPACE }}

    defaults:
      run:
        working-directory: environments/GlobalAcademy-Ian

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Validate Plan Run
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail

          if [[ ! "$PLAN_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Informe um Run ID numérico válido."
            exit 1
          fi

          plan_run="$(curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${PLAN_RUN_ID}")"

          if ! jq -e --arg sha "$GITHUB_SHA" '
            .event == "push" and
            .head_branch == "main" and
            .conclusion == "success" and
            .head_sha == $sha and
            ((.path | split("@")[0]) == ".github/workflows/terraform-plan.yml")
          ' <<< "$plan_run" > /dev/null; then
            echo "::error::O plano não pertence a uma execução bem-sucedida da main para o commit atual."
            exit 1
          fi

          main_sha="$(curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -er '.object.sha')"

          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::A main avançou desde o início desta execução. Gere um novo plano."
            exit 1
          fi

          echo "Plano validado para o commit $GITHUB_SHA."

      - name: Download Plan Artifact
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan
          path: environments/GlobalAcademy-Ian
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ github.token }}

      - name: Validate Plan Artifact
        run: |
          set -euo pipefail

          test -s tfplan
          test -s tfplan.txt
          test -s terraform-version.txt

          planned_version="$(cat terraform-version.txt)"
          current_version="$(terraform version -json | jq -r '.terraform_version')"

          if [[ "$planned_version" != "$current_version" ]]; then
            echo "::error::A versão do Terraform difere daquela usada para gerar o plano."
            exit 1
          fi

      - name: Write OCI API Key
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$OCI_PRIVATE_KEY"
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$TF_VAR_private_key_path"

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="namespace=$STATE_NAMESPACE" \
            -backend-config="region=$TF_VAR_region" \
            -backend-config="auth=APIKey" \
            -backend-config="tenancy_ocid=$TF_VAR_tenancy_ocid" \
            -backend-config="user_ocid=$TF_VAR_user_ocid" \
            -backend-config="fingerprint=$TF_VAR_fingerprint" \
            -backend-config="private_key_path=$TF_VAR_private_key_path"

      - name: Recheck Main and Apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          main_sha="$(curl -fsSL --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -er '.object.sha')"

          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::A main mudou antes do apply. Gere e revise um novo plano."
            exit 1
          fi

          terraform apply -input=false -no-color tfplan

      - name: Remove OCI API Key
        if: always()
        run: rm -f /tmp/oci_api_key.pem
