name: Terraform

# Automático (push na main e pull request): validate + plan.
# Manual (Actions > Terraform > Run workflow): validate + plan + apply.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: "1.14.x"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  # Variáveis do Terraform vindas dos secrets/variables do repositório
  TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
  TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
  TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
  TF_VAR_private_key_path: /tmp/oci_api_key.pem
  TF_VAR_region: ${{ vars.OCI_REGION }}
  TF_VAR_compartment_id: ${{ vars.OCI_COMPARTMENT_ID }}
  TF_VAR_image_id: ${{ vars.OCI_IMAGE_ID }}
  TF_VAR_admin_cidrs: ${{ vars.ADMIN_CIDRS }}
  # State remoto (Object Storage)
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  STATE_NAMESPACE: ${{ vars.OCI_NAMESPACE }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/GlobalAcademy-Ian
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Gravar chave de API da OCI
        env:
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$OCI_PRIVATE_KEY" > "$TF_VAR_private_key_path"

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="namespace=$STATE_NAMESPACE" \
            -backend-config="region=$TF_VAR_region" \
            -backend-config="auth=APIKey" \
            -backend-config="tenancy_ocid=$TF_VAR_tenancy_ocid" \
            -backend-config="user_ocid=$TF_VAR_user_ocid" \
            -backend-config="fingerprint=$TF_VAR_fingerprint" \
            -backend-config="private_key_path=$TF_VAR_private_key_path"

      - name: 1. Validate
        run: |
          terraform fmt -check -recursive ../..
          terraform validate

      - name: 2. Plan
        run: terraform plan -out=tfplan

      - name: 3. Apply (somente execução manual)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: terraform apply tfplan
